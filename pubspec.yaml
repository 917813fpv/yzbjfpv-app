name: yzbjfpv
description: YZBJFPV multi-platform FPV app client (Android / Windows / iOS)
publish_to: 'none'
version: 0.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.16.0
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

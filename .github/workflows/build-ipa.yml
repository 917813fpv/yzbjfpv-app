name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Package IPA from archive
        run: |
          # flutter skips ipa export when --no-codesign, so pack the archive manually
          mkdir -p build/ios/Payload
          cp -R "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" build/ios/Payload/
          (cd build/ios && zip -r -y "$GITHUB_WORKSPACE/YZBJFPV-iOS-unsigned.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/YZBJFPV-iOS-unsigned.ipa"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "$GITHUB_WORKSPACE/YZBJFPV-iOS-unsigned.ipa" \
            --title "YZBJFPV iOS unsigned IPA $TAG" \
            --notes "Unsigned IPA, sign locally with i4Tools then sideload."

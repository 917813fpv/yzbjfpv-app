name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Package IPA from archive
        run: |
          # flutter skips ipa export when --no-codesign, so pack the archive manually
          mkdir -p build/ios/Payload
          cp -R "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" build/ios/Payload/
          cd build/ios
          zip -r -y ../YZBJFPV-iOS-unsigned.ipa Payload
          cd ..
          ls -la YZBJFPV-iOS-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yzbjfpv-ios-unsigned
          path: YZBJFPV-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" YZBJFPV-iOS-unsigned.ipa \
            --title "YZBJFPV iOS unsigned IPA $TAG" \
            --notes "Unsigned IPA, sign locally with i4Tools (爱思助手) then sideload."

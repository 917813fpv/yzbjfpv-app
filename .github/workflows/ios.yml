name: iOS Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ipa --no-codesign --release
      - run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -r -y ../YZBJFPV-V0.0.1.2Beta-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: YZBJFPV-unsigned-ipa
          path: YZBJFPV-V0.0.1.2Beta-unsigned.ipa
